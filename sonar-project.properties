# SonarQube Cloud analysis configuration. The organization and project keys
# come from the SonarQube Cloud project import and must match it exactly.
sonar.organization=lucacappelletti94-github
sonar.projectKey=LucaCappelletti94_cargo-dejadoc
sonar.projectName=cargo-dejadoc

sonar.sources=src,tests
# Integration tests live in the tests/ tree. Inline #[cfg(test)] modules stay
# classified as sources, which is the Rust reality.
sonar.test.inclusions=**/tests/**
sonar.exclusions=target/**
sonar.sourceEncoding=UTF-8

# The analyzer runs cargo clippy itself against the root manifest.
sonar.rust.cargo.manifestPaths=Cargo.toml

# Unit test coverage generated by cargo-llvm-cov in the Sonar workflow.
sonar.rust.lcov.reportPaths=lcov.info
