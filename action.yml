name: dejadoc
description: >-
  Dejadoc scans and canonicalizes your workspace's doctests and functions,
  reporting any duplicates. Use it in your GitHub CI!

branding:
  icon: 'copy'
  color: 'orange'
inputs:
  threshold:
    description: Report duplicate groups with at least this many sites
    required: false
    default: '2'
  min-tokens:
    description: Skip doctest bodies with fewer tokens than this
    required: false
    default: '0'
  functions:
    description: Also check for duplicated functions
    required: false
    default: 'false'
  fn-min-tokens:
    description: Skip functions whose body counts fewer tokens than this, a path or an operator counting as one
    required: false
    default: ''
  context-blocks:
    description: Also check for duplicated context blocks
    required: false
    default: 'false'
  context-min-tokens:
    description: Skip context blocks with fewer tokens than this
    required: false
    default: ''
  context-select:
    description: Select the local contexts to check, empty keeps the whole workspace
    required: false
    default: ''
  context-search:
    description: Restrict the comparison corpus to one context scope
    required: false
    default: ''
  context-dependency-depth:
    description: Search dependency sources to this shortest-path depth, zero stays local
    required: false
    default: '0'
  context-dev-dependencies:
    description: Include development dependency edges
    required: false
    default: 'false'
  context-build-dependencies:
    description: Include build dependency edges
    required: false
    default: 'false'
  context-all-optional-dependencies:
    description: Explore optional dependency paths outside the selected feature configuration
    required: false
    default: 'false'
  context-features:
    description: Cargo features enabled for dependency discovery
    required: false
    default: ''
  context-all-features:
    description: Enable all features for dependency discovery
    required: false
    default: 'false'
  context-no-default-features:
    description: Disable default features for dependency discovery
    required: false
    default: 'false'
  context-target:
    description: Target triple used for dependency discovery
    required: false
    default: ''
  context-cache-dir:
    description: Persistent dependency index directory, empty for a run-local directory
    required: false
    default: ''
  context-check-latest:
    description: Check the latest published release of indexed dependencies
    required: false
    default: 'true'
  context-fail-on-reuse:
    description: Make dependency reuse findings fail the duplicate gate
    required: false
    default: 'false'
  all-targets:
    description: Also scan bin and example targets
    required: false
    default: 'false'
  package:
    description: Restrict the scan to one workspace member by name
    required: false
    default: ''
  version:
    description: The dejadoc version to install, empty for the latest
    required: false
    default: ''
  install:
    description: Install dejadoc, false uses the cargo dejadoc already on the path
    required: false
    default: 'true'
  cwd:
    description: The workspace directory to scan
    required: false
    default: ''
  pr-number:
    description: Post the findings as a pull request review on this PR instead of failing the job
    required: false
    default: ''
  dry-run:
    description: Render the review instead of posting it
    required: false
    default: 'false'
  only-new:
    description: In pull request mode report only duplicates this pull request introduces
    required: false
    default: 'true'
  annotations:
    description: Annotate each copy to remove, which needs no token
    required: false
    default: 'true'
  mode:
    description: "review posts the findings in one job, while prepare and post split it so a workflow_run job can review a fork's pull request"
    required: false
    default: 'review'
  payload:
    description: Directory holding the prepared review, written by prepare and read by post
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install dejadoc
      if: ${{ inputs.mode != 'post' && inputs.install == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        repo="LucaCappelletti94/cargo-dejadoc"
        tag=''
        [ -n "$VERSION" ] && tag="v$VERSION"

        # Keep these targets in sync with the release matrix in .github/workflows/release.yml.
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)   target=x86_64-unknown-linux-gnu ;;
          Linux/ARM64) target=aarch64-unknown-linux-gnu ;;
          macOS/X64)   target=x86_64-apple-darwin ;;
          macOS/ARM64) target=aarch64-apple-darwin ;;
          Windows/X64) target=x86_64-pc-windows-msvc ;;
          *)           target='' ;;
        esac

        if [ -n "$target" ]; then
          asset="cargo-dejadoc-$target.tar.gz"
          dest="$RUNNER_TEMP/dejadoc-bin"
          mkdir -p "$dest"
          # Action series releases carry no binaries and GitHub marks the newest one Latest,
          # so resolve the newest release that actually ships the asset instead of trusting Latest.
          if [ -z "$tag" ]; then
            tag="$(gh api "repos/$repo/releases?per_page=30" --paginate \
              --jq ".[] | select(.draft == false and .prerelease == false) | select([.assets[].name] | index(\"$asset\")) | .tag_name" 2>/dev/null | head -n1)" || true
          fi
          args=(--repo "$repo" --pattern "$asset" --dir "$dest" --clobber)
          [ -n "$tag" ] && args=("$tag" "${args[@]}")
          if err="$(gh release download "${args[@]}" 2>&1)"; then
            bin=cargo-dejadoc
            [ "$RUNNER_OS" = Windows ] && bin=cargo-dejadoc.exe
            tar -xzf "$dest/$asset" -C "$dest"
            chmod +x "$dest/$bin" 2>/dev/null || true
            echo "$dest" >> "$GITHUB_PATH"
            echo "dejadoc: installed the prebuilt $asset from $tag"
            exit 0
          fi
          echo "dejadoc: could not download $asset, falling back to source"
          printf '%s\n' "$err" | sed 's/^/dejadoc: /'
        else
          echo "dejadoc: no prebuilt binary for $RUNNER_OS/$RUNNER_ARCH, falling back to source"
        fi

        install=(dejadoc)
        [ -n "$tag" ] && install+=(--version "$VERSION")
        cargo install "${install[@]}"

    - name: Resolve the dependency index directory
      id: cache-dir
      if: ${{ inputs.mode != 'post' && inputs.context-dependency-depth > 0 }}
      shell: bash
      env:
        CONTEXT_CACHE_DIR: ${{ inputs.context-cache-dir }}
      run: |
        dir="${CONTEXT_CACHE_DIR:-$RUNNER_TEMP/dejadoc-context-index}"
        mkdir -p "$dir/public"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "dejadoc-context-index-dir=$dir" >> "$GITHUB_ENV"

    - name: Restore the dependency index
      if: ${{ inputs.mode != 'post' && inputs.context-dependency-depth > 0 }}
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ env.dejadoc-context-index-dir }}/public
        key: dejadoc-context-index-${{ runner.os }}-${{ inputs.context-target != '' && inputs.context-target || 'any' }}-v1
        restore-keys: dejadoc-context-index-${{ runner.os }}-

    - name: Scan for duplicates
      id: scan
      if: ${{ inputs.mode != 'post' }}
      shell: bash
      working-directory: ${{ inputs.cwd }}
      env:
        ALL_TARGETS: ${{ inputs.all-targets }}
        PACKAGE: ${{ inputs.package }}
        PR_NUMBER: ${{ inputs.pr-number }}
        DRY_RUN: ${{ inputs.dry-run }}
        THRESHOLD: ${{ inputs.threshold }}
        MIN_TOKENS: ${{ inputs.min-tokens }}
        FUNCTIONS: ${{ inputs.functions }}
        FN_MIN_TOKENS: ${{ inputs.fn-min-tokens }}
        ANNOTATIONS: ${{ inputs.annotations }}
        CONTEXT_BLOCKS: ${{ inputs.context-blocks }}
        CONTEXT_MIN_TOKENS: ${{ inputs.context-min-tokens }}
        CONTEXT_SELECT: ${{ inputs.context-select }}
        CONTEXT_SEARCH: ${{ inputs.context-search }}
        CONTEXT_DEPTH: ${{ inputs.context-dependency-depth }}
        CONTEXT_DEV: ${{ inputs.context-dev-dependencies }}
        CONTEXT_BUILD: ${{ inputs.context-build-dependencies }}
        CONTEXT_ALL_OPT: ${{ inputs.context-all-optional-dependencies }}
        CONTEXT_FEATURES: ${{ inputs.context-features }}
        CONTEXT_ALL_FEATURES: ${{ inputs.context-all-features }}
        CONTEXT_NO_DEFAULT: ${{ inputs.context-no-default-features }}
        CONTEXT_TARGET: ${{ inputs.context-target }}
        CONTEXT_CACHE_DIR: ${{ env.dejadoc-context-index-dir }}
        CONTEXT_CHECK_LATEST: ${{ inputs.context-check-latest }}
        CONTEXT_FAIL: ${{ inputs.context-fail-on-reuse }}
      run: |
        # Report paths are relative to the workspace root cargo resolves, the cwd or one of
        # its ancestors. GitHub reads, matches and links paths from the repository root, so
        # one prefix from that root projects every report path for the later steps.
        root="$(cargo metadata --no-deps --format-version 1 2>/dev/null | jq -r '.workspace_root')" || root=''
        prefix=''
        if [ -n "$root" ] && [ -n "${GITHUB_WORKSPACE:-}" ]; then
          prefix="$(realpath --relative-to="$GITHUB_WORKSPACE" "$root" 2>/dev/null)" || prefix=''
          [ "$prefix" = "." ] && prefix=''
        fi
        printf '%s' "$prefix" > "$RUNNER_TEMP/dejadoc-prefix"
        printf '%s\n' 'if $prefix == "" then . else ((.groups[]?.sites[]?, .context_groups[]?.sites[]?) |= (.file = "\($prefix)/\(.file)")) | (if .reuse then (.reuse.groups[]?.local |= (.file = "\($prefix)/\(.file)")) else . end) end' \
          > "$RUNNER_TEMP/dejadoc-root.jq"
        set --
        [ "$ALL_TARGETS" = "true" ] && set -- --all-targets "$@"
        [ -n "$PACKAGE" ] && set -- --package "$PACKAGE" "$@"
        [ "$FUNCTIONS" = "true" ] && set -- --functions "$@"
        [ -n "$FN_MIN_TOKENS" ] && set -- --fn-min-tokens "$FN_MIN_TOKENS" "$@"
        [ "$CONTEXT_BLOCKS" = "true" ] && set -- --context-blocks "$@"
        [ -n "$CONTEXT_MIN_TOKENS" ] && set -- --context-min-tokens "$CONTEXT_MIN_TOKENS" "$@"
        [ -n "$CONTEXT_SELECT" ] && set -- --context-select "$CONTEXT_SELECT" "$@"
        [ -n "$CONTEXT_SEARCH" ] && set -- --context-search "$CONTEXT_SEARCH" "$@"
        if [ "$CONTEXT_DEPTH" != "0" ]; then
          set -- --context-dependency-depth "$CONTEXT_DEPTH" "$@"
          [ "$CONTEXT_DEV" = "true" ] && set -- --context-dev-dependencies "$@"
          [ "$CONTEXT_BUILD" = "true" ] && set -- --context-build-dependencies "$@"
          [ "$CONTEXT_ALL_OPT" = "true" ] && set -- --context-all-optional-dependencies "$@"
          [ -n "$CONTEXT_FEATURES" ] && set -- --context-features "$CONTEXT_FEATURES" "$@"
          [ "$CONTEXT_ALL_FEATURES" = "true" ] && set -- --context-all-features "$@"
          [ "$CONTEXT_NO_DEFAULT" = "true" ] && set -- --context-no-default-features "$@"
          [ -n "$CONTEXT_TARGET" ] && set -- --context-target "$CONTEXT_TARGET" "$@"
          [ -n "$CONTEXT_CACHE_DIR" ] && set -- --context-cache-dir "$CONTEXT_CACHE_DIR" "$@"
          [ "$CONTEXT_CHECK_LATEST" = "false" ] && set -- --context-check-latest false "$@"
          [ "$CONTEXT_FAIL" = "true" ] && set -- --context-fail-on-reuse "$@"
        fi
        if [ -n "$PR_NUMBER" ] || [ "$DRY_RUN" = "true" ]; then
          report="$RUNNER_TEMP/dejadoc-report.json"
          status=0
          cargo dejadoc \
            --threshold "$THRESHOLD" \
            --min-tokens "$MIN_TOKENS" \
            --no-fail --json "$@" > "$report.raw" || status=$?
          if [ ! -s "$report.raw" ]; then
            echo "dejadoc: the scan produced no report"
            exit 2
          fi
          jq --arg prefix "$prefix" -f "$RUNNER_TEMP/dejadoc-root.jq" "$report.raw" > "$report"
          rm -f "$report.raw"
          jq -r '. as $r | "\($r.total) doctests, \($r.unique) unique, \($r.functions // 0) functions, \($r.unique_functions // 0) unique functions, \($r.groups | length) duplicated groups"' "$report"
          # The whole scan in the run summary, which needs no token, so a
          # fork pull request has it whatever the review can do.
          {
            jq -r '"### dejadoc\n\n\(.total) doctests, \(.unique) unique, \(.functions // 0) functions, \(.unique_functions // 0) unique functions, \(.groups | length) duplicated groups"' "$report"
            jq -r '
              .groups[] | "\n- group `\(.id)`, \(.kind // "doctest"), \(.sites | length) copies\n"
                + (.sites | map("  - `" + .file + ":" + (.line | tostring) + "`  " + .item)
                   | join("\n"))' "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          # Context groups and dependency reuse, grouped by local context with
          # the accessible APIs first, in the same public report.
          context_summary="$(jq -r '
            def sp: .file;
            def site_md: "  - `" + sp + ":" + (.line | tostring) + "`  " + .item;
            def cand_md:
              "  - `\(.package) \(.version)`"
              + (if .depth > 0 then " (depth \(.depth))" else "" end)
              + (if (.conditions | length) > 0 then " (needs \(.conditions | join(", ")))" else "" end)
              + (if .action == "reuse-api" then ": the public item `\(.api_path // .site.item)` can be reused"
                 elif .action == "upgrade-api" then ": the public item `\(.api_path // .site.item)` is available in a newer published release"
                 elif .action == "request-extraction" then ": the internal item `\(.site.item)` can be requested for extraction"
                 elif .action == "unresolved" then ": source analysis does not establish accessibility"
                 else ": the reuse path is unresolved" end)
              + (if .source_url
                 then (if .api_path and .api_path != .site.item then " [source (\(.site.item))](\(.source_url))" else " [source](\(.source_url))" end)
                 else "" end)
              + (if .existing_issue then " [existing request \(.existing_issue.state)](\(.existing_issue.url))"
                 elif .issue_url then " [request extraction](\(.issue_url))"
                 elif .action == "request-extraction" then " (the upstream repository is not declared, so no issue link is offered)"
                 else "" end)
              + (if .lookup_warning then "\n    lookup: \(.lookup_warning)" else "" end);
            (if (.context_groups | length) > 0
             then "### Context groups\n\n"
                  + ([ .context_groups[]
                      | "- group `\(.id)`, \(.sites | length) copies\n"
                        + ([ .sites[] | site_md ] | join("\n"))
                    ] | join("\n"))
             else "" end)
            + (if ((.reuse // {}) | (.groups // []) | length) > 0
               then "### Dependency reuse\n\n"
                    + ([ (.reuse.groups // [])[]
                        | "- local `" + (.local | sp) + ":" + (.local.line | tostring) + "`  " + .local.item + "\n"
                          + ([ .candidates[] | cand_md ] | join("\n"))
                      ] | join("\n"))
                    + "Dependency coverage: \(.reuse.coverage.packages) packages, \(.reuse.coverage.indexed_files) files indexed, \(.reuse.coverage.cached_files) from cache"
                    + (if .reuse.coverage.complete then "" else "\n\nThe requested dependency analysis is incomplete, the run fails\n" + ([ .reuse.coverage.failures[] | "- " + . ] | join("\n")) end)
                    + (if (.reuse.coverage.warnings | length) > 0 then "\n" + ([ .reuse.coverage.warnings[] | "- " + . ] | join("\n")) else "" end)
               else "" end)' "$report")"
          if [ -n "$context_summary" ]; then
            printf '%s\n\n' "$context_summary" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$(jq '(.groups | length) + (.context_groups | length) + ((.reuse // {}).groups // [] | length)' "$report")" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$CONTEXT_DEPTH" != "0" ]; then
            index_ok=false
            [ "$(jq -r '.reuse.coverage.complete // false' "$report")" = "true" ] && index_ok=true
            echo "index-ok=$index_ok" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
        else
          out="$RUNNER_TEMP/dejadoc-gate.txt"
          status=0
          gate=()
          [ "$ANNOTATIONS" = "true" ] && gate+=(--github)
          cargo dejadoc \
            --threshold "$THRESHOLD" \
            --min-tokens "$MIN_TOKENS" \
            "${gate[@]}" "$@" > "$out" || status=$?
          # GitHub resolves an annotation path from the repository root.
          if [ -n "$prefix" ]; then
            while IFS= read -r line; do
              case "$line" in
                ::*" file="*) printf '%s file=%s/%s\n' "${line%% file=*}" "$prefix" "${line#* file=}" ;;
                *) printf '%s\n' "$line" ;;
              esac
            done < "$out" > "$out.rooted"
            mv "$out.rooted" "$out"
          fi
          cat "$out"
          {
            echo '### dejadoc'
            echo
            echo '```'
            grep -v '^::' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CONTEXT_DEPTH" != "0" ]; then
            case "$status" in
              0|1) echo "index-ok=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "index-ok=false" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
          exit "$status"
        fi

    - name: Scan the base commit
      if: ${{ inputs.pr-number != '' && inputs.only-new == 'true' && inputs.mode != 'post' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        CWD: ${{ inputs.cwd }}
        ALL_TARGETS: ${{ inputs.all-targets }}
        PACKAGE: ${{ inputs.package }}
        THRESHOLD: ${{ inputs.threshold }}
        MIN_TOKENS: ${{ inputs.min-tokens }}
        FUNCTIONS: ${{ inputs.functions }}
        FN_MIN_TOKENS: ${{ inputs.fn-min-tokens }}
        CONTEXT_BLOCKS: ${{ inputs.context-blocks }}
        CONTEXT_MIN_TOKENS: ${{ inputs.context-min-tokens }}
        CONTEXT_SELECT: ${{ inputs.context-select }}
        CONTEXT_SEARCH: ${{ inputs.context-search }}
        CONTEXT_DEPTH: ${{ inputs.context-dependency-depth }}
        CONTEXT_DEV: ${{ inputs.context-dev-dependencies }}
        CONTEXT_BUILD: ${{ inputs.context-build-dependencies }}
        CONTEXT_ALL_OPT: ${{ inputs.context-all-optional-dependencies }}
        CONTEXT_FEATURES: ${{ inputs.context-features }}
        CONTEXT_ALL_FEATURES: ${{ inputs.context-all-features }}
        CONTEXT_NO_DEFAULT: ${{ inputs.context-no-default-features }}
        CONTEXT_TARGET: ${{ inputs.context-target }}
        CONTEXT_CACHE_DIR: ${{ env.dejadoc-context-index-dir }}
        CONTEXT_CHECK_LATEST: ${{ inputs.context-check-latest }}
        CONTEXT_FAIL: ${{ inputs.context-fail-on-reuse }}
      run: |
        # The base report lets the review ignore duplicates that already exist on the
        # base commit. Any failure degrades to reviewing the full report.
        base_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.base.sha' 2>/dev/null)" || base_sha=''
        if [ -z "$base_sha" ]; then
          echo "dejadoc: cannot read the base commit, the full report is reviewed"
          exit 0
        fi
        if ! git -C "$GITHUB_WORKSPACE" fetch -q --depth 1 origin "$base_sha" \
          || ! git -C "$GITHUB_WORKSPACE" worktree add -q --detach "$RUNNER_TEMP/dejadoc-base" "$base_sha"; then
          echo "dejadoc: cannot check out the base commit, the full report is reviewed"
          exit 0
        fi
        printf '%s\n' "$base_sha" > "$RUNNER_TEMP/dejadoc-base-sha"
        dir="$RUNNER_TEMP/dejadoc-base"
        [ -n "$CWD" ] && dir="$dir/$CWD"
        set --
        [ "$ALL_TARGETS" = "true" ] && set -- --all-targets "$@"
        [ -n "$PACKAGE" ] && set -- --package "$PACKAGE" "$@"
        [ "$FUNCTIONS" = "true" ] && set -- --functions "$@"
        [ -n "$FN_MIN_TOKENS" ] && set -- --fn-min-tokens "$FN_MIN_TOKENS" "$@"
        [ "$CONTEXT_BLOCKS" = "true" ] && set -- --context-blocks "$@"
        [ -n "$CONTEXT_MIN_TOKENS" ] && set -- --context-min-tokens "$CONTEXT_MIN_TOKENS" "$@"
        [ -n "$CONTEXT_SELECT" ] && set -- --context-select "$CONTEXT_SELECT" "$@"
        [ -n "$CONTEXT_SEARCH" ] && set -- --context-search "$CONTEXT_SEARCH" "$@"
        if [ "$CONTEXT_DEPTH" != "0" ]; then
          set -- --context-dependency-depth "$CONTEXT_DEPTH" "$@"
          [ "$CONTEXT_DEV" = "true" ] && set -- --context-dev-dependencies "$@"
          [ "$CONTEXT_BUILD" = "true" ] && set -- --context-build-dependencies "$@"
          [ "$CONTEXT_ALL_OPT" = "true" ] && set -- --context-all-optional-dependencies "$@"
          [ -n "$CONTEXT_FEATURES" ] && set -- --context-features "$CONTEXT_FEATURES" "$@"
          [ "$CONTEXT_ALL_FEATURES" = "true" ] && set -- --context-all-features "$@"
          [ "$CONTEXT_NO_DEFAULT" = "true" ] && set -- --context-no-default-features "$@"
          [ -n "$CONTEXT_TARGET" ] && set -- --context-target "$CONTEXT_TARGET" "$@"
          [ -n "$CONTEXT_CACHE_DIR" ] && set -- --context-cache-dir "$CONTEXT_CACHE_DIR" "$@"
          [ "$CONTEXT_CHECK_LATEST" = "false" ] && set -- --context-check-latest false "$@"
          [ "$CONTEXT_FAIL" = "true" ] && set -- --context-fail-on-reuse "$@"
        fi
        # Threshold 1 inventories every base site, a group the pull request
        # completes from a single existing copy must still be reported.
        # The base tree has the head's layout, so the head's prefix roots its paths.
        base_report="$RUNNER_TEMP/dejadoc-base-report.json"
        if ! (cd "$dir" && cargo dejadoc \
          --threshold 1 \
          --min-tokens "$MIN_TOKENS" \
          --no-fail --json "$@") > "$base_report.raw" \
          || ! jq --rawfile prefix "$RUNNER_TEMP/dejadoc-prefix" -f "$RUNNER_TEMP/dejadoc-root.jq" \
            "$base_report.raw" > "$base_report"; then
          rm -f "$base_report"
          echo "dejadoc: the base scan failed, the full report is reviewed"
        fi
        rm -f "$base_report.raw"

    - name: Review the findings on the pull request
      if: ${{ inputs.mode == 'post' || (steps.scan.outputs.found == 'true' && (inputs.pr-number != '' || inputs.dry-run == 'true')) }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        DRY_RUN: ${{ inputs.dry-run }}
        ANNOTATIONS: ${{ inputs.annotations }}
        MODE: ${{ inputs.mode }}
        PAYLOAD: ${{ inputs.payload }}
      run: |
        # No set -e here. Each step checks its own status and writes an outcome file, so a
        # failed api call degrades to a skipped review instead of aborting the run.
        pr="$PR_NUMBER"
        dry="$DRY_RUN"
        repo="$GITHUB_REPOSITORY"
        report="$RUNNER_TEMP/dejadoc-report.json"
        base_report="$RUNNER_TEMP/dejadoc-base-report.json"
        body="$RUNNER_TEMP/dejadoc-review.md"
        status="$RUNNER_TEMP/dejadoc-post-status"
        inline_file="$RUNNER_TEMP/dejadoc-inline.tsv"
        mode="$MODE"
        payload="${PAYLOAD:-$RUNNER_TEMP/dejadoc-payload}"
        comments="$payload/comments.ndjson"
        meta="$payload/review.json"
        reuse_tmp="$RUNNER_TEMP/dejadoc-reuse.ndjson"
        if [ "$mode" = "post" ]; then
          reuse_tmp="$payload/reuse.ndjson"
        fi
        review_event=''
        mkdir -p "$payload"
        failed_sites=''
        out_of_range=''
        onlynew=0
        [ -s "$base_report" ] && onlynew=1
        base_sha="$(cat "$RUNNER_TEMP/dejadoc-base-sha" 2>/dev/null || echo '')"
        # Post mode consumes a payload another job prepared, so it reads no
        # source tree and skips straight to the api calls.
        if [ "$mode" = "post" ]; then
          if [ ! -s "$meta" ]; then
            echo "dejadoc: the prepared review is missing from $payload"
            echo "failed" > "$status"
            exit 1
          fi
          pr="$(jq -r '.pr' "$meta")"
          head_sha="$(jq -r '.head_sha' "$meta")"
          out_of_range="$(jq -r '.out_of_range' "$meta")"
          findings="$(jq -r '.findings' "$meta")"
          review_event="$(jq -r '.event // empty' "$meta")"
          findings_span=0
          grep -qE " (on another type|and can't be deleted|under another cfg|and is public API)\$" <<< "$findings" && findings_span=1
        else
        # The head SHA and changed file list, empty when there is no pull request.
        head_sha=''
        changed_files=''
        if [ -n "$pr" ]; then
          head_sha="$(gh api "repos/$repo/pulls/$pr" --jq '.head.sha' 2>/dev/null)" || head_sha=''
          if [ -n "$head_sha" ]; then
            changed_files="$(gh api "repos/$repo/pulls/$pr/files" --paginate --jq '.[].filename' 2>/dev/null)" || changed_files=''
          fi
        fi
        if [ -n "$pr" ] && [ -z "$head_sha" ] && [ "$dry" != "true" ]; then
          echo "dejadoc: cannot read pull request $pr, the review is not posted"
          echo "failed" > "$status"
          exit 1
        fi
        if [ "$dry" = "true" ]; then
          # A dry run renders the review as if every scanned site were in
          # the diff, so the step summary shows each comment in full.
          changed_json="$(jq -r '
            ([.groups[].sites[].file]
             + [(.context_groups // [])[] | .sites[].file]
             + [((.reuse // {}).groups // [])[] | .local.file]) | unique' "$report")"
        elif [ -n "$pr" ] && [ -n "$head_sha" ] && [ -n "$changed_files" ]; then
          changed_json="$(printf '%s\n' "$changed_files" | jq -R . | jq -s .)"
        else
          changed_json='[]'
        fi

        # Base site identity, a site exists on the base when the same hash, item and
        # path were already there, and the first base copy is the kept original.
        if [ "$onlynew" = "1" ]; then
          base_json="$(jq '
            { keys: ([.groups[] | .hash as $h | .sites[] | "\($h)\t\(.item)\t\(.file)"]
                     + [(.context_groups // [])[] | .hash as $h | .sites[] | "\($h)\t\(.item)\t\(.file)"]
                     + [((.reuse // {}).groups // [])[] | .hash as $h | .local as $l | "\($h)\t\($l.item)\t\($l.file)"]),
              keep: (reduce .groups[] as $gr ({};
                .[$gr.hash] = ($gr.sites[0].file + ":" + ($gr.sites[0].line | tostring)))),
              keep_ctx: (reduce (.context_groups // [])[] as $gr ({};
                .[$gr.hash] = ($gr.sites[0].file + ":" + ($gr.sites[0].line | tostring)))),
              keep_end: (reduce .groups[] as $gr ({}; .[$gr.hash] = ($gr.sites[0].end // null))),
              keep_item: (reduce .groups[] as $gr ({}; .[$gr.hash] = $gr.sites[0].item)) }' "$base_report")"
        else
          base_json='{"keys": [], "keep": {}, "keep_ctx": {}, "keep_end": {}, "keep_item": {}}'
        fi

        # Sites to comment on. In only-new mode a site must be introduced by this
        # pull request, a new hash, item or path relative to the base report. A
        # site is inline when its file is in the pull request diff.
        onlynew_mode=false
        [ "$onlynew" = "1" ] && onlynew_mode=true
        # One command line argument holds at most 128 KiB, a large pull request's
        # file list exceeds it, so jq reads both lists from files.
        changed_file="$RUNNER_TEMP/dejadoc-changed.json"
        base_file="$RUNNER_TEMP/dejadoc-base-keys.json"
        printf '%s' "$changed_json" > "$changed_file"
        printf '%s' "$base_json" > "$base_file"
        jq -r --slurpfile changed "$changed_file" --slurpfile base "$base_file" \
          --argjson onlynew_mode "$onlynew_mode" '
          $changed[0] as $changed
          | $base[0] as $base
          | . as $r
          | [ range(0; ($r.groups | length)) as $gi
              | $r.groups[$gi]
              | ($gi + 1) as $g
              | (.sites | length) as $n
              | .hash as $h
              | (.sites[0].file + ":" + (.sites[0].line | tostring)) as $first
              | (.sites[0].end // null) as $fend
              | (.kind // "doctest") as $kind
              | ([.sites[].self_type] as $t | ($t[0]) as $f | ($t[1:] | map(. != $f) | any)) as $spans
              # A binary older than 0.4.1 sends no remedy, its rule only told types apart.
              | (if $kind == "function" then (.remedy // (if $spans then "generic-or-macro" else "delete" end)) else "delete" end) as $remedy
              | (reduce (.sites[] | (.self_type // "free function")) as $t ([]; if index($t) == null then . + [$t] else . end) | join(", ")) as $selftypes
              | (.sites[0].item) as $firstitem
              | ($base.keep[$h] // "") as $basekeep
              | ($base.keep_item[$h] // "") as $baseitem
              | ([ .sites[] | ([$h, .item, .file] | join("\t")) ]) as $ks
              | [ .sites | to_entries[]
                  | (([$h, .value.item, .value.file] | join("\t")) as $k
                     | (([ $ks[: .key ][] | select(. == $k) ] | length) + 1) as $idx
                     | ([ $base.keys[] | select(. == $k) ] | length) as $bcount
                     | { g: $g, c: (.key + 1), n: $n, first: $first, fend: $fend, s: .value,
                         p: .value.file,
                         isNew: ($idx > $bcount),
                         basekeep: $basekeep, bend: ($base.keep_end[$h] // null),
                         kind: $kind, remedy: $remedy, selftypes: $selftypes, firstitem: $firstitem,
                         baseitem: $baseitem }) ] as $rows
              | ($rows | map(select(.isNew)) | length) as $knew
              | $rows[] | . + { knew: $knew }
          ]
          | .[]
          | . as $row
          | select(($changed | index($row.p)) != null)
          | select(if $onlynew_mode then $row.isNew else true end)
          | [$row.p, (.s.line | tostring), .s.item, (.g | tostring), (.c | tostring),
             (.n | tostring), .first, (if .isNew then "1" else "0" end),
             (if .basekeep == "" then "-" else .basekeep end), (.knew | tostring),
             (.s.end // "-" | tostring), (.fend // "-" | tostring), (.bend // "-" | tostring),
             .kind, .remedy, .firstitem,
             (if .baseitem == "" then "-" else .baseitem end), .selftypes,
             (if .s.public then "1" else "0" end)]
          | @tsv' "$report" > "$inline_file"
        # Neutral reuse and context entries, one row per local site that survives
        # the same changed-file and only-new filters as the local duplicates.
        jq -c --slurpfile changed "$changed_file" --slurpfile base "$base_file" \
          --argjson onlynew_mode "$onlynew_mode" '
          def spath: .file;
          def site_md: "  - `" + spath + ":" + (.line | tostring) + "`  " + .item;
          def cand_md:
            "  - `\(.package) \(.version)`"
            + (if .depth > 0 then " (depth \(.depth))" else "" end)
            + (if (.conditions | length) > 0 then " (needs \(.conditions | join(", ")))" else "" end)
            + (if .action == "reuse-api" then ": the public item `\(.api_path // .site.item)` can be reused"
               elif .action == "upgrade-api" then ": the public item `\(.api_path // .site.item)` is available in a newer published release"
               elif .action == "request-extraction" then ": the internal item `\(.site.item)` can be requested for extraction"
               elif .action == "unresolved" then ": source analysis does not establish accessibility"
               else ": the reuse path is unresolved" end)
            + (if .source_url
               then (if .api_path and .api_path != .site.item then " [source (\(.site.item))](\(.source_url))" else " [source](\(.source_url))" end)
               else "" end)
            + (if .existing_issue then " [existing request \(.existing_issue.state)](\(.existing_issue.url))"
               elif .issue_url then " [request extraction](\(.issue_url))"
               elif .action == "request-extraction" then " (the upstream repository is not declared, so no issue link is offered)"
               else "" end)
            + (if .lookup_warning then "\n    lookup: \(.lookup_warning)" else "" end);
          $changed[0] as $changed
          | $base[0] as $base
          | [ ( (.context_groups // [])
                | .[] as $gr
                | ($base.keep_ctx[$gr.hash] // "") as $basekeep
                | ($gr.sites | length) as $n
                | range(0; $n) as $i
                    | (if $i == 0 and (($basekeep == "") or ($onlynew_mode | not)) then empty else $gr.sites[$i] end) as $s
                    | ($gr.hash + "\t" + $s.item + "\t" + ($s | spath)) as $k
                    | { path: ($s | spath), line: $s.line, end: $s.end, item: $s.item,
                        kind: "context", hash: $gr.hash,
                        isNew: (([ $base.keys[] | select(. == $k) ] | length) == 0),
                        others: ([ $gr.sites | to_entries[] | select(.key != $i) | .value | site_md ]) }
              )
              , ( ((.reuse // {}).groups // [])
                  | .[] as $gr
                  | $gr.local as $l
                  | ($gr.hash + "\t" + $l.item + "\t" + ($l | spath)) as $k
                  | { path: ($l | spath), line: $l.line, end: $l.end, item: $l.item,
                      kind: "reuse", hash: $gr.hash,
                      isNew: (([ $base.keys[] | select(. == $k) ] | length) == 0),
                      candidates_md: ([ $gr.candidates[] | cand_md ] | join("\n")) } )
            ]
          | map(. as $e | select(($changed | index($e.path)) != null))
          | map(select(if $onlynew_mode then .isNew else true end))
          | .[]
        ' "$report" > "$reuse_tmp"

        # The inline posts, live mode only. The first post is the permission probe.
        # Each comment links to a prefilled wrong-review issue for its group.
        uri() { jq -rn --arg s "$1" '$s | @uri'; }
        version="$(cargo dejadoc --version | awk '{ print $NF }')"
        report_link() {
          local sites
          sites="$(jq -r --argjson g "$1" '
            .groups[$g - 1].sites as $s
            | [$s[:12][] | "\(.file):\(.line)  \(.item)"]
              + (if ($s | length) > 12 then ["and \(($s | length) - 12) more"] else [] end)
            | join("\n")' "$report")"
          printf '[👎 Report a wrong review](https://github.com/LucaCappelletti94/cargo-dejadoc/issues/new?template=wrong-review.yml&title=%s&version=%s&review=%s&group=%s)' \
            "$(uri "Wrong review on $repo#$pr, group $1")" \
            "$(uri "$version")" \
            "$(uri "$GITHUB_SERVER_URL/$repo/pull/$pr")" \
            "$(uri "$sites")"
        }
        support_link='[❤️ Support dejadoc](https://github.com/sponsors/LucaCappelletti94)'
        # A permalink to lines $3 to $4 of path $2 at commit $1, GitHub shows
        # and highlights those lines. Without a sha it falls back to plain text.
        blob_link() {
          local anchor label
          if [ -n "${4:-}" ] && [ "$4" != "$3" ]; then
            anchor="#L$3-L$4"
            label="$3-$4"
          else
            anchor="#L$3"
            label="$3"
          fi
          if [ -n "$1" ]; then
            printf '[`%s:%s`](%s/%s/blob/%s/%s%s)' "$2" "$label" "$GITHUB_SERVER_URL" "$repo" "$1" "$2" "$anchor"
          else
            printf '`%s:%s`' "$2" "$label"
          fi
        }
        # The bare permalink url GitHub expands into a code preview of the
        # cited lines, empty when no commit is known.
        blob_url() {
          [ -n "$1" ] || return 0
          if [ -n "${4:-}" ] && [ "$4" != "$3" ]; then
            printf '%s/%s/blob/%s/%s#L%s-L%s' "$GITHUB_SERVER_URL" "$repo" "$1" "$2" "$3" "$4"
          else
            printf '%s/%s/blob/%s/%s#L%s' "$GITHUB_SERVER_URL" "$repo" "$1" "$2" "$3"
          fi
        }
        # The inline text location of a block, `path:start` or `path:start-end`.
        loc_text() {
          if [ -n "${3:-}" ] && [ "$3" != "$2" ]; then
            printf '`%s:%s-%s`' "$1" "$2" "$3"
          else
            printf '`%s:%s`' "$1" "$2"
          fi
        }
        # The permalink wrapped in a markdown link when it exists.
        loc_md() {
          if [ -n "$2" ]; then
            printf '[%s](%s)' "$1" "$2"
          else
            printf '%s' "$1"
          fi
        }
        # The bare url GitHub previews as code, collapsed in a details block
        # when the block spans more than ten lines.
        preview_of() {
          local n="${3:-$2}" label="${4:-the duplicated doctest}"
          if [ $((n - $2 + 1)) -gt 10 ]; then
            printf '<details>\n<summary>Show %s</summary>\n\n%s\n\n</details>' "$label" "$1"
          else
            printf '%s' "$1"
          fi
        }
        # Workflow command escaping, a property also ends at `,` or `:`.
        escape_data() {
          local s="${1//%/%25}"
          s="${s//$'\r'/%0D}"
          printf '%s' "${s//$'\n'/%0A}"
        }
        escape_property() {
          local s
          s="$(escape_data "$1")"
          s="${s//:/%3A}"
          printf '%s' "${s//,/%2C}"
        }
        rendered=''
        findings=''
        findings_span=0
        # One pass builds every comment, live posts them, the dry run renders them.
        # The end line of each block comes from the report, `-` when the crate has
        # none, a block spanning an include or an escaped literal, or an older binary.
        declare -A seen_first=() seen_first_end=()
        while IFS=$'\t' read -r p line item g c n first new basekeep knew end fend bend kind remedy firstitem baseitem selftypes public; do
          [ -n "$p" ] || continue
          # A public copy that already shipped is called or deprecated, deleting it breaks callers.
          if [ "$remedy" = "delete" ] && [ "$kind" = "function" ] && [ "$public" = "1" ] && [ "$onlynew" != "1" ]; then
            remedy=public
          fi
          site="$p:$line"
          [ "$basekeep" = "-" ] && basekeep=''
          [ "$end" = "-" ] && end=''
          [ "$fend" = "-" ] && fend=''
          [ "$bend" = "-" ] && bend=''
          [ "$baseitem" = "-" ] && baseitem=''
          kept_item="$firstitem"
          [ -n "$baseitem" ] && kept_item="$baseitem"
          if [ "$new" = "1" ] && [ -z "${seen_first[$g]:-}" ]; then
            seen_first[$g]="$site"
            seen_first_end[$g]="$end"
          fi
          if [ "$onlynew" = "1" ]; then
            if [ -n "$basekeep" ] || [ "$site" != "${seen_first[$g]}" ]; then removable=1; else removable=0; fi
          elif [ "$c" != "1" ]; then
            removable=1
          else
            removable=0
          fi
          keepat="$first"
          keepat_end="$fend"
          if [ "$new" = "1" ]; then
            keepat="${seen_first[$g]:-$first}"
            keepat_end="${seen_first_end[$g]:-$fend}"
          fi
          # Comments only land on copies the author should act on, a kept
          # copy stays silent.
          [ "$removable" = "1" ] || continue
          # The annotation carries the same finding without a token, so a
          # fork pull request shows it anchored in the diff.
          if [ "$ANNOTATIONS" = "true" ] && [ "$dry" != "true" ]; then
            keep="$basekeep"
            [ -z "$keep" ] && keep="$keepat"
            if [ "$kind" = "function" ]; then
              case "$remedy" in
                generic-or-macro) where='on another type' share='a generic or a macro can share it' ;;
                helper-or-macro) where="and can't be deleted" share='a helper or a macro can share it' ;;
                merge-cfg) where='under another cfg' share='one function under both cfgs can replace them' ;;
                public) where='and is public API' share='make it call the kept copy or deprecate it' ;;
                *) where='' share='' ;;
              esac
              if [ -n "$where" ]; then
                printf '::error file=%s,line=%s,title=dejadoc::%s repeats %s at %s %s, %s, group %s\n' \
                  "$(escape_property "$p")" "$line" "$(escape_data "$item")" "$(escape_data "$kept_item")" "$(escape_data "$keep")" "$where" "$share" "$g"
                findings="$findings- \`$p:$line\`  $item, repeats \`$kept_item\` at \`$keep\` $where"$'\n'
                findings_span=1
              else
                printf '::error file=%s,line=%s,title=dejadoc::%s duplicates the function %s at %s, group %s\n' \
                  "$(escape_property "$p")" "$line" "$(escape_data "$item")" "$(escape_data "$kept_item")" "$(escape_data "$keep")" "$g"
                findings="$findings- \`$p:$line\`  $item, duplicates the function \`$kept_item\` at \`$keep\`"$'\n'
              fi
            else
              printf '::error file=%s,line=%s,title=dejadoc::%s duplicates the doctest at %s, group %s\n' \
                "$(escape_property "$p")" "$line" "$(escape_data "$item")" "$(escape_data "$keep")" "$g"
              findings="$findings- \`$p:$line\`  $item, duplicates \`$keep\`"$'\n'
            fi
          fi
          close_line="$end"
          if [ -z "$close_line" ]; then
            out_of_range="$out_of_range- group $g  $(blob_link "$head_sha" "$p" "$line")  $item"$'\n'
            continue
          fi
          # The suggestion deletes the block plus the empty line right after
          # it, which would become a stray once the copy is gone.
          delete_end="$close_line"
          if [ "$remedy" = "delete" ]; then
            nx="$(awk -v l="$close_line" 'NR == l + 1 { print "x" $0; exit }' "$p" 2>/dev/null)"
            if [ -n "$nx" ] && [ -z "$(printf '%s' "${nx#x}" | tr -d '[:space:]')" ]; then
              delete_end=$((close_line + 1))
            fi
          fi
          url=''
          loc=''
          pv_s=''
          pv_e=''
          if [ "$onlynew" = "1" ] && [ -n "$basekeep" ]; then
            bp="${basekeep%:*}"
            bl="${basekeep##*:}"
            ce="$bend"
            url="$(blob_url "$base_sha" "$bp" "$bl" "$ce")"
            pv_s="$bl"
            pv_e="$ce"
            loc="$(loc_md "$(loc_text "$bp" "$bl" "$ce")" "$url")"
          elif [ "$onlynew" = "1" ]; then
            kp="${keepat%:*}"
            kl="${keepat##*:}"
            ce="$keepat_end"
            url="$(blob_url "$head_sha" "$kp" "$kl" "$ce")"
            pv_s="$kl"
            pv_e="$ce"
            loc="$(loc_md "$(loc_text "$kp" "$kl" "$ce")" "$url")"
          else
            fp="${first%:*}"
            fl="${first##*:}"
            ce="$fend"
            url="$(blob_url "$head_sha" "$fp" "$fl" "$ce")"
            pv_s="$fl"
            pv_e="$ce"
            loc="$(loc_md "$(loc_text "$fp" "$fl" "$ce")" "$url")"
          fi
          dejadoc_link='[dejadoc](https://github.com/LucaCappelletti94/cargo-dejadoc)'
          if [ "$kind" = "function" ]; then
            if [ "$remedy" != "delete" ]; then
              preview='the repeated function'
            else
              preview='the duplicated function'
            fi
          else
            preview='the duplicated doctest'
          fi
          if [ "$remedy" = "generic-or-macro" ]; then
            note="This method repeats \`$kept_item\` at $loc on another type ($selftypes). A generic or a macro can share one body."
          elif [ "$remedy" = "helper-or-macro" ]; then
            note="This function repeats \`$kept_item\` at $loc. A trait or an exported symbol needs it, so it can't simply be deleted, a helper or a macro can share one body."
          elif [ "$remedy" = "public" ]; then
            note="This function repeats \`$kept_item\` at $loc. It is public API, so deleting it breaks its callers, make it call the kept copy or deprecate it."
          elif [ "$remedy" = "merge-cfg" ]; then
            note="This function repeats \`$kept_item\` at $loc under another \`cfg\`. Deleting either copy drops a configuration, one function under both conditions can replace them."
          elif [ "$kind" = "function" ]; then
            if [ "$onlynew" = "1" ] && [ -n "$basekeep" ]; then
              note="This function was added by this pull request and duplicates a copy that already exists at $loc, $dejadoc_link suggests deleting the added copy, or updating it if it was meant to differ."
            elif [ "$onlynew" = "1" ]; then
              note="This pull request adds $knew copies of the same function, $dejadoc_link suggests keeping the first added copy at $loc and deleting this one, or updating it if it was meant to differ."
            else
              note="This function appears $n times in this module, this is copy $c. $dejadoc_link suggests keeping the first copy at $loc and deleting this one, or updating it if it was meant to differ."
            fi
          elif [ "$onlynew" = "1" ] && [ -n "$basekeep" ]; then
            note="This doctest was added by this pull request and duplicates a copy that already exists at $loc, [dejadoc](https://github.com/LucaCappelletti94/cargo-dejadoc) suggests removing the added copy."
          elif [ "$onlynew" = "1" ]; then
            note="This pull request adds $knew copies of the same doctest, [dejadoc](https://github.com/LucaCappelletti94/cargo-dejadoc) suggests keeping the first added copy at $loc and removing this one."
          else
            note="This doctest appears $n times in this scan, this is copy $c. [dejadoc](https://github.com/LucaCappelletti94/cargo-dejadoc) suggests keeping the first copy at $loc and removing this one."
          fi
          comment="$note"
          [ -n "$url" ] && comment="$comment"$'\n\n'"$(preview_of "$url" "$pv_s" "$pv_e" "$preview")"
          if [ "$remedy" = "delete" ]; then
            comment="$comment"$'\n\n```suggestion\n```'
          fi
          comment="$comment"$'\n\n'"$(report_link "$g") $support_link"
          if [ "$dry" = "true" ]; then
            rendered+="$comment"$'\n\n'
            continue
          fi
          # One row per comment, so a later job can post it without the
          # source tree it was computed from.
          jq -cn --arg path "$p" --arg start "$line" --arg stop "$delete_end" \
            --arg group "$g" --arg item "$item" --arg close "$close_line" --arg body "$comment" \
            '{path: $path, start_line: ($start | tonumber), line: ($stop | tonumber),
              group: $group, item: $item, close_line: ($close | tonumber), body: $body}' \
            >> "$comments"
        done < "$inline_file"
        # The neutral reuse and context entries, the local comment minus the
        # removal suggestion, so approximate and upstream matches stay advice.
        reuse_rendered=''
        if [ -s "$reuse_tmp" ]; then
          reuse_built="$RUNNER_TEMP/dejadoc-reuse-built.ndjson"
          : > "$reuse_built"
          while IFS= read -r row; do
            [ -n "$row" ] || continue
            p="$(printf '%s' "$row" | jq -r '.path')"
            line="$(printf '%s' "$row" | jq -r '.line')"
            end="$(printf '%s' "$row" | jq -r '.end')"
            item="$(printf '%s' "$row" | jq -r '.item')"
            kind="$(printf '%s' "$row" | jq -r '.kind')"
            others="$(printf '%s' "$row" | jq -r '.others | join("\n")')"
            candidates_md="$(printf '%s' "$row" | jq -r '.candidates_md // empty')"
            if [ "$kind" = "context" ]; then
              note="This context is repeated in this scan. A shared helper can carry it once. The other copies are at"
              [ -n "$others" ] && note="$note"$'\n'"$others"
            else
              note="This context matches an upstream dependency context. The accessible APIs are listed first"
              note="$note"$'\n'"$candidates_md"
            fi
            note="$note"$'\n\n'"Type compatibility and behavior equivalence need human review."
            r_url="$(blob_url "$head_sha" "$p" "$line" "$end")"
            comment="$note"
            [ -n "$r_url" ] && comment="$comment"$'\n\n'"$(preview_of "$r_url" "$line" "$end" "the local context")"
            comment="$comment"$'\n\n'"$support_link"
            if [ "$dry" = "true" ]; then
              reuse_rendered+="$comment"$'\n\n'
              continue
            fi
            jq -cn --arg path "$p" --arg start "$line" --arg stop "$end" \
              --arg item "$item" --arg kind "$kind" --arg body "$comment" \
              '{path: $path, start_line: ($start | tonumber), line: ($stop | tonumber),
                item: $item, kind: $kind, body: $body}' >> "$reuse_built"
          done < "$reuse_tmp"
          mv "$reuse_built" "$reuse_tmp"
        fi

        run_url="$GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID"
        if [ "$dry" = "true" ]; then
          stats="$(jq -r '"\(.total) doctests, \(.unique) unique, \(.functions // 0) functions, \(.unique_functions // 0) unique functions, \(.groups | length) duplicated groups"' "$report")"
          groups_block="$(jq -r '
            .groups | to_entries | map(
                "Group \(.key + 1), \(.value.kind // "doctest"), \(.value.sites | length) copies\n\n"
                + "```\n\(.value.sites[0].code)\n```\n\n"
                + (.value.sites | to_entries | map(
                    (if .key == 0 then "first  " else "copy   " end)
                    + .value.file + ":" + (.value.line | tostring) + "  " + .value.item
                    + (if (.value.info | length) > 0 then "   (" + (.value.info | join(", ")) + ")" else "" end)
                  ) | join("\n")) + "\n\n"
            ) | join("")' "$report")"
          {
            title='Duplicated doctests found by dejadoc'
            if [ "$(jq '[.groups[] | select(.kind == "function")] | length' "$report")" -gt 0 ]; then
              title='Duplicates found by dejadoc'
            fi
            printf '%s\n' "$title"
            echo 'dejadoc dry run, the review is not posted'
            echo
            printf '%s\n' "$stats"
            echo
            printf '%s\n\n' "$groups_block"
            echo 'Inline comments dejadoc would post'
            echo
            printf '%s' "$rendered"
            if [ -n "$reuse_rendered" ]; then
              echo
              echo 'Neutral reuse and context advice dejadoc would post'
              echo
              printf '%s' "$reuse_rendered"
            fi
            if [ -n "$out_of_range" ]; then
              echo
              echo 'Sites outside the lines GitHub shows in the diff, the review body would list them'
              echo
              printf '%s' "$out_of_range"
            fi
            echo
            echo
            echo "Run $run_url"
          } > "$body"
          { echo; cat "$body"; } >> "$GITHUB_STEP_SUMMARY"
          echo "dejadoc dry run, the review is not posted"
          cat "$body"
          echo "dry-run" > "$status"
          exit 0
        fi

          # Both lists grow with the pull request, past one argument's 128 KiB.
          printf '%s' "$out_of_range" > "$RUNNER_TEMP/dejadoc-out-of-range.txt"
          printf '%s' "$findings" > "$RUNNER_TEMP/dejadoc-findings.txt"
          event='REQUEST_CHANGES'
          [ -s "$comments" ] || [ -n "$out_of_range" ] || event='COMMENT'
          jq -n --arg pr "$pr" --arg head "$head_sha" --arg event "$event" \
            --rawfile oor "$RUNNER_TEMP/dejadoc-out-of-range.txt" --rawfile f "$RUNNER_TEMP/dejadoc-findings.txt" \
            '{pr: $pr, head_sha: $head, event: $event, out_of_range: $oor, findings: $f}' > "$meta"
          touch "$comments"
          touch "$reuse_tmp"
        fi
        # Nothing to post, in prepare mode the payload still exists so the
        # posting job has something to download.
        if [ ! -s "$comments" ] && [ -z "$out_of_range" ] && [ ! -s "$reuse_tmp" ]; then
          if [ "$onlynew" = "1" ]; then
            echo "dejadoc: no duplicate was introduced by this pull request, the review is not posted"
            echo "skipped-existing" > "$status"
          else
            echo "dejadoc: no duplicate is in the pull request diff, the review is not posted"
            echo "skipped-nodiff" > "$status"
          fi
          exit 0
        fi
        # The reported copies in the run summary, beside the whole scan the
        # scan step wrote there.
        if [ -n "$findings" ] && [ "$dry" != "true" ]; then
          findings_title='#### Copies to remove'
          [ "$findings_span" = "1" ] && findings_title='#### Findings'
          {
            echo
            printf '%s\n' "$findings_title"
            echo
            printf '%s' "$findings"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "$mode" = "prepare" ]; then
          cp "$reuse_tmp" "$payload/reuse.ndjson"
          echo "dejadoc: the review is prepared in $payload for a later job"
          echo "prepared" > "$status"
          exit 0
        fi

        readonly_notice() {
          echo "dejadoc: the GITHUB_TOKEN is read-only for this pull request, the review is not posted"
          echo "dejadoc: the annotations and the run summary carry the findings, the removal suggestion needs a review comment"
        }
        # The first post is the permission probe.
        readonly=0
        post_one() {
          local row="$1" p line err item g
          p="$(printf '%s' "$row" | jq -r '.path')"
          line="$(printf '%s' "$row" | jq -r '.start_line')"
          if ! err="$(printf '%s' "$row" | jq -r '.body' | gh api "repos/$repo/pulls/$pr/comments" \
            -f "commit_id=$head_sha" -f "path=$p" \
            -F "start_line=$line" -F "line=$(printf '%s' "$row" | jq -r '.line')" \
            -f start_side=RIGHT -f side=RIGHT -F 'body=@-' 2>&1)"; then
            if printf '%s' "$err" | grep -qE 'HTTP 403|"status": "403"'; then
              readonly=1
              return 1
            fi
            item="$(printf '%s' "$row" | jq -r '.item')"
            g="$(printf '%s' "$row" | jq -r '.group // .kind')"
            printf 'dejadoc: %s:%s %s\n' "$p" "$line" "$item"
            printf '%s\n' "$err" | sed 's/^/dejadoc: /'
            if printf '%s' "$err" | grep -qE 'HTTP 422|"status": "422"'; then
              out_of_range="$out_of_range- group $g  $(printf '`%s:%s`' "$p" "$line")  $item"$'\n'
            else
              failed_sites="$failed_sites  group $g  $p:$line  $item"$'\n'
            fi
          fi
          return 0
        }
        while IFS= read -r row; do
          [ -n "$row" ] || continue
          post_one "$row" || break
        done < "$comments"
        if [ "$readonly" != "1" ]; then
          while IFS= read -r row; do
            [ -n "$row" ] || continue
            post_one "$row" || break
          done < "$reuse_tmp"
        fi
        if [ "$readonly" = "1" ]; then
          readonly_notice
          echo "skipped-readonly" > "$status"
          exit 0
        fi
        # A review with no comment of its own needs a body. Sites GitHub could not
        # anchor inline are listed with permalinks to the head commit.
        if [ -z "$review_event" ]; then
          review_event='REQUEST_CHANGES'
          [ -s "$comments" ] || [ -n "$out_of_range" ] || review_event='COMMENT'
        fi
        review=(-f "event=$review_event")
        review_body=''
        if [ -n "$out_of_range" ]; then
          review_body="$(printf 'These duplicates are not on lines GitHub shows in this pull request diff, the inline comment cannot attach there. The links point at the copies on the head commit.\n\n%s' "$out_of_range")"
        fi
        if [ -n "$failed_sites" ]; then
          failed_block="$(printf '\n\nDuplicates dejadoc could not comment inline\n\n```\n%s```' "$failed_sites")"
          review_body="$review_body$failed_block"
        fi
        if [ -n "$review_body" ]; then
          review+=(-f "body=$review_body")
        fi
        if ! resp="$(gh api -X POST "repos/$repo/pulls/$pr/reviews" "${review[@]}" 2>&1)"; then
          if printf '%s' "$resp" | grep -qE 'HTTP 403|"status": "403"'; then
            readonly_notice
            echo "skipped-readonly" > "$status"
            exit 0
          fi
          echo "dejadoc: posting the review failed"
          printf '%s\n' "$resp"
          echo "failed" > "$status"
          exit 1
        fi
        posted_state="$(printf '%s' "$resp" | jq -r '.state' 2>/dev/null)" || posted_state=''
        if [ "$posted_state" != "$review_event" ]; then
          echo "dejadoc: the review response is unexpected"
          printf '%s\n' "$resp"
          echo "failed" > "$status"
          exit 1
        fi
        if [ -n "$failed_sites" ]; then
          echo "dejadoc: the inline comments failed for the following sites"
          printf '%s' "$failed_sites"
        fi
        echo "dejadoc: posted the review on pull request $pr"
        echo "posted" > "$status"

    - name: Save the dependency index
      if: ${{ always() && !cancelled() && inputs.mode != 'post' && inputs.context-dependency-depth > 0 && steps.scan.outputs.index-ok == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ env.dejadoc-context-index-dir }}/public
        key: dejadoc-context-index-${{ runner.os }}-${{ inputs.context-target != '' && inputs.context-target || 'any' }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
