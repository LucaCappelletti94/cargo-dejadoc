name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
      - run: cargo test --workspace
      - run: cargo clippy --workspace --lib --no-default-features -- -D warnings
      - run: cargo test --workspace --lib --no-default-features
      - run: cargo clippy -p dejadoc --all-targets --no-default-features --features std -- -D warnings
      - run: cargo test -p dejadoc --no-default-features --features std
