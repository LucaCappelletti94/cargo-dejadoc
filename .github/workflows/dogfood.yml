name: Dogfood

on:
  push:
    branches: [main]
  pull_request:

permissions:
  pull-requests: write

jobs:
  dogfood:
    name: Dogfood the action on the fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./
        with:
          cwd: ${{ startsWith(github.head_ref, 'dogfood-api-check-') && 'tests/fixtures/apicheck' || 'tests/fixtures/dupws' }}
          pr-number: ${{ github.event.pull_request.number }}
          dry-run: ${{ github.event_name == 'push' }}
          # The fixture duplicates are deliberate, so they are not flagged on this repository's own diffs.
          annotations: false
      - name: Check the posting behavior
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          status="$(cat "$RUNNER_TEMP/dejadoc-post-status" 2>/dev/null || echo missing)"
          body="$RUNNER_TEMP/dejadoc-review.md"
          repo="$GITHUB_REPOSITORY"
          case "$status" in
            dry-run)
              [ -f "$body" ] || { echo "the review body is missing"; exit 1; }
              grep -q 'duplicated groups' "$body" || { echo "the summary line is missing"; exit 1; }
              grep -q 'tests/fixtures/dupws/alpha/src/util.rs' "$body" || { echo "the fixture sites are missing"; exit 1; }
              grep -q 'times in this scan' "$body" || { echo "the copy count wording is missing"; exit 1; }
              grep -q 'keeping the first copy at' "$body" || { echo "the kept copy location is missing"; exit 1; }
              grep -q 'Support dejadoc](https://github.com/sponsors/LucaCappelletti94)' "$body" || { echo "the support link is missing"; exit 1; }
              n_comments="$(grep -c 'Support dejadoc](https://github.com/sponsors/LucaCappelletti94)' "$body")"
              [ "$n_comments" = "4" ] || { echo "expected one comment per removable copy, got $n_comments"; exit 1; }
              ;;
            posted)
              n="$PR_NUMBER"
              [ -n "$n" ] || { echo "the pull request number is empty"; exit 1; }
              api_retry() {
                local tries="$1" pause="$2" out i
                shift 2
                for ((i = 0; i < tries; i++)); do
                  if out="$(gh api "$@" 2>/dev/null)"; then
                    printf '%s\n' "$out"
                    return 0
                  fi
                  [ "$i" -lt $((tries - 1)) ] && sleep "$pause"
                done
                return 1
              }
              if api_retry 3 5 "repos/$repo/pulls/$n/files" --jq '.[].filename' | grep -q '^tests/fixtures/'; then
                rows="$(api_retry 6 10 "repos/$repo/pulls/$n/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | select(.path | startswith("tests/fixtures/")) | "\(.path)\t\(.start_line)\t\(.line)"')"
                [ -n "$rows" ] || { echo "the inline dejadoc comments are missing on the fixture files"; exit 1; }
                # Each suggestion deletes one whole block, from its opening line to its
                # closing fence, or the single indented line, plus one blank line after it.
                while IFS=$'\t' read -r p s e; do
                  first="$(sed -n "${s}p" "$p")"
                  last="$(sed -n "${e}p" "$p")"
                  [ -z "$(printf '%s' "$last" | sed 's|^///||' | tr -d '[:space:]')" ] && last="$(sed -n "$((e - 1))p" "$p")"
                  case "$first" in
                    *'```'*|*'~~~'*) fence="${first##*/// }"; fence="${fence:0:3}" ;;
                    '///     '*) fence='' ;;
                    *) echo "comment on $p:$s does not start on a doctest block: $first"; exit 1 ;;
                  esac
                  if [ -n "$fence" ]; then
                    [ "$last" = "/// $fence" ] || { echo "comment on $p:$s-$e does not end on its closing fence: $last"; exit 1; }
                  else
                    [ "$last" = "$first" ] || { echo "comment on $p:$s-$e spans past its indented block: $last"; exit 1; }
                  fi
                  echo "verified $p:$s-$e deletes exactly one doctest block"
                done <<< "$rows"
              else
                echo "the fixture files are not in pull request $n, skipping the inline comment check"
              fi
              ;;
            skipped-nodiff)
              echo "no duplicated doctest is in the pull request diff, the review was skipped as expected"
              ;;
            skipped-readonly)
              echo "read-only token, the review was skipped as expected for a fork pull request"
              ;;
            skipped-existing)
              echo "no duplicate is introduced by this pull request, the review was skipped as expected"
              ;;
            *)
              echo "unexpected post status: $status"
              exit 1
              ;;
          esac

  payload:
    name: Prepare a review payload without posting it
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./
        with:
          # The scheduled check branch adds copies to apicheck, dupws stays as the integration tests pin it.
          cwd: ${{ startsWith(github.head_ref, 'dogfood-api-check-') && 'tests/fixtures/apicheck' || 'tests/fixtures/dupws' }}
          pr-number: ${{ github.event.pull_request.number }}
          mode: prepare
          payload: dejadoc-payload
          only-new: false
          annotations: false
      - name: Check the prepared payload
        env:
          # The check branch diff is the one apicheck file with two added copies, an
          # ordinary pull request touches any subset of the dupws files.
          EXPECTED_ROWS: ${{ startsWith(github.head_ref, 'dogfood-api-check-') && '2' || '' }}
        run: |
          set -euo pipefail
          status="$(cat "$RUNNER_TEMP/dejadoc-post-status")"
          jq -e '.pr != "" and (.head_sha | length) == 40' dejadoc-payload/review.json > /dev/null \
            || { echo "the payload metadata is incomplete"; exit 1; }
          case "$status" in
            prepared)
              rows="$(wc -l < dejadoc-payload/comments.ndjson)"
              [ "$rows" -gt 0 ] || { echo "expected one row per removable copy in the diff, got none"; exit 1; }
              [ -z "$EXPECTED_ROWS" ] || [ "$rows" = "$EXPECTED_ROWS" ] || { echo "expected $EXPECTED_ROWS rows, got $rows"; exit 1; }
              jq -e 'select(.path | startswith("tests/fixtures/")) | .line >= .start_line and (.body | contains("```suggestion"))' \
                dejadoc-payload/comments.ndjson > /dev/null \
                || { echo "a payload row is malformed"; exit 1; }
              echo "the prepared payload holds one postable comment per removable copy"
              ;;
            skipped-nodiff)
              [ ! -s dejadoc-payload/comments.ndjson ] \
                || { echo "a skipped payload must hold no comment"; exit 1; }
              echo "the fixture files are not in this pull request diff, the payload is empty as expected"
              ;;
            *)
              echo "unexpected prepare status: $status"
              exit 1
              ;;
          esac
