name: Dogfood the action on a scheduled pull request

on:
  schedule:
    - cron: '6 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: dogfood-schedule
  cancel-in-progress: true

jobs:
  api-check:
    name: Exercise the pull request review surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mint an app token to open the check pull request
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DOGFOOD_APP_ID }}
          private-key: ${{ secrets.DOGFOOD_APP_PRIVATE_KEY }}

      # A failed run leaves its pull request open; this step keeps the repository free of them.
      - name: Close the previous check pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --json number,title \
            | jq -r '.[] | select(.title | startswith("dejadoc API check")) | .number' \
            | while read -r n; do
                gh pr close "$n"
              done

      - name: Open the check pull request
        id: open
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch="dogfood-api-check-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # Two copies the base does not have, so only-new mode posts on them, one behind
          # a tilde fence and one indented. The apicheck fixture is not pinned by the
          # integration tests, dupws is.
          printf '%s\n' '' \
            '/// A tilde fenced copy added by the API check.' \
            '/// ~~~' \
            '/// fn helper() { }' \
            '/// ~~~' \
            'pub fn helper_tilde() {}' \
            '' \
            '/// An indented copy added by the API check.' \
            '///' \
            '///     @ nope nope' \
            'pub fn unparsed_indented() {}' \
            >> tests/fixtures/apicheck/src/lib.rs
          git add tests/fixtures/apicheck/src/lib.rs
          git commit -m "Add two doctest copies for the API check"
          git push origin "$branch"
          url="$(gh pr create --head "$branch" --title "dejadoc API check, $(date -u +%F)" --body 'Opened by the scheduled dogfood to exercise the pull request review surface against the GitHub API. It closes itself when the check passes.')"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      # The pull request run of the dogfood workflow posts the review and asserts it; the wait correlates on the head sha and workflow path.
      - name: Wait for the dogfood run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          for i in $(seq 1 20); do
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=50" --jq '[.workflow_runs[] | select(.path == ".github/workflows/dogfood.yml")] | first // empty' 2>/dev/null)"
            if [ -n "$run_json" ]; then
              status="$(printf '%s' "$run_json" | jq -r '.status')"
              conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // empty')"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "the dogfood run succeeded"
                  exit 0
                fi
                echo "the dogfood run finished with $conclusion, the check pull request stays open for inspection"
                exit 1
              fi
            fi
            [ "$i" -lt 20 ] && sleep 90
          done
          echo "the dogfood run did not finish within the 30 minute window, the check pull request stays open for inspection"
          exit 1

      - name: Close the check pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr close "${{ steps.open.outputs.number }}"
