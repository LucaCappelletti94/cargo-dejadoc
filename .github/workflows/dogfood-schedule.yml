name: Dogfood the action on a scheduled pull request

on:
  schedule:
    - cron: '6 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: dogfood-schedule
  cancel-in-progress: true

jobs:
  api-check:
    name: Exercise the pull request review surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mint an app token to open the check pull request
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DOGFOOD_APP_ID }}
          private-key: ${{ secrets.DOGFOOD_APP_PRIVATE_KEY }}

      # A failed run leaves its pull request open; this step keeps the repository free of them.
      - name: Close the previous check pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --json number,title \
            | jq -r '.[] | select(.title | startswith("dejadoc API check")) | .number' \
            | while read -r n; do
                gh pr close "$n"
              done

      - name: Open the check pull request
        id: open
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch="dogfood-api-check-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # One touch per removable copy, since GitHub only accepts an inline comment on a line the diff shows.
          sed -i '1s/Helper with a doctest/A helper with a doctest/' tests/fixtures/dupws/alpha/src/util.rs
          sed -i '15s/Formatting variant of the same doctest/A formatting variant of the same doctest/' tests/fixtures/dupws/alpha/src/lib.rs
          sed -i '1s/Beta copy of the helper doctest/A beta copy of the helper doctest/' tests/fixtures/dupws/beta/src/util.rs
          sed -i '8s/Unparseable body shared with alpha/An unparseable body shared with alpha/' tests/fixtures/dupws/beta/src/lib.rs
          if [ "$(git diff --name-only | wc -l)" != "4" ]; then
            echo "the fixture touch did not change all four files, a fixture line may have moved"
            git diff --stat
            exit 1
          fi
          git add tests/fixtures/dupws/alpha/src/util.rs tests/fixtures/dupws/alpha/src/lib.rs \
            tests/fixtures/dupws/beta/src/util.rs tests/fixtures/dupws/beta/src/lib.rs
          git commit -m "Touch the fixture for the API check"
          git push origin "$branch"
          url="$(gh pr create --head "$branch" --title "dejadoc API check, $(date -u +%F)" --body 'Opened by the scheduled dogfood to exercise the pull request review surface against the GitHub API. It closes itself when the check passes.')"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      # The pull request run of the dogfood workflow posts the review and asserts it; the wait correlates on the head sha and workflow path.
      - name: Wait for the dogfood run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          for i in $(seq 1 20); do
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=50" --jq '[.workflow_runs[] | select(.path == ".github/workflows/dogfood.yml")] | first // empty' 2>/dev/null)"
            if [ -n "$run_json" ]; then
              status="$(printf '%s' "$run_json" | jq -r '.status')"
              conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // empty')"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "the dogfood run succeeded"
                  exit 0
                fi
                echo "the dogfood run finished with $conclusion, the check pull request stays open for inspection"
                exit 1
              fi
            fi
            [ "$i" -lt 20 ] && sleep 90
          done
          echo "the dogfood run did not finish within the 30 minute window, the check pull request stays open for inspection"
          exit 1

      - name: Close the check pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr close "${{ steps.open.outputs.number }}"
