[package]
name = "dejadoc"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
authors = ["Luca Cappelletti"]
description = "Find duplicated Rust doctests, functions and contexts"
license = "MIT"
repository = "https://github.com/LucaCappelletti94/cargo-dejadoc"
keywords = ["cargo-subcommand", "doctest", "duplicate-detection", "cli", "rustdoc"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/docs", "/skills", "/fuzz", "/.clusterfuzzlite"]

[[bin]]
name = "cargo-dejadoc"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
std = ["dep:cargo_metadata", "dep:thiserror", "dep:toml", "dep:ureq", "dep:flate2", "dep:tar", "dep:semver", "dep:tempfile"]
cli = ["std", "dep:clap"]

[dependencies]
blake3 = { version = "1.8.7", default-features = false }
cargo_metadata = { version = "0.23.1", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
flate2 = { version = "1", optional = true }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
quote = { version = "1.0.47", default-features = false }
semver = { version = "1", optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
syn = { version = "3.0.5", default-features = false, features = ["full", "parsing", "printing", "clone-impls", "visit", "visit-mut"] }
syn-canon = { version = "0.2.0", path = "syn-canon" }
tar = { version = "0.4", optional = true }
tempfile = { version = "3.27.0", optional = true }
thiserror = { version = "2.0.20", optional = true }
toml = { version = "1.1.6", optional = true }
ureq = { version = "3.1", default-features = false, features = ["rustls"], optional = true }

[dev-dependencies]
serde_json = "1.0.151"
serde_norway = "0.9.42"
tempfile = "3.27.0"

[profile.release]
strip = true

# The test profile with optimized code, for the exhaustive search witnesses that run for minutes
# unoptimized. Debug assertions and overflow checks stay on.
[profile.fast-test]
inherits = "test"
opt-level = 1
debug = "line-tables-only"

[profile.fast-test.package."*"]
opt-level = 2

[lints]
workspace = true

[workspace]
members = ["syn-canon"]

[workspace.lints.rust]
missing_docs = "forbid"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
unsafe_code = "forbid"
deprecated = "deny"
unknown_lints = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
redundant_closure_for_method_calls = "deny"
