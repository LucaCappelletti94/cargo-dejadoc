[package]
name = "dejadoc"
version = "0.1.0"
edition = "2024"
description = "Find duplicated Rust doctests across a workspace"

[[bin]]
name = "cargo-dejadoc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
cargo_metadata = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "3.0.5", features = ["full"] }
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
missing_docs = "forbid"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
unsafe_code = "forbid"
deprecated = "deny"
unknown_lints = "allow"

[lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
